[workspace]
members = ["macros"]
resolver = "2"

[package]
name = "newton-machine"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Newtonian state machines: typed Harel configurations, an Elm update loop, and inertial history as a sidecar."
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/newton-machine"
homepage = "https://github.com/shan-alexander/newton-machine"
repository = "https://github.com/shan-alexander/newton-machine"
keywords = ["state-machine", "statechart", "elm", "harel", "mvu"]
categories = ["data-structures", "no-std", "rust-patterns"]
authors = ["Newton Machine Contributors"]
# GitHub-only: examples/, benches/, docs/ (rustbrain), .github/.
# `cargo publish` will warn that examples are ignored; that is intended.
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["alloc"]
alloc = ["serde?/alloc"]
serde = ["dep:serde"]
macros = ["dep:newton-machine-macros"]

[dependencies]
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
newton-machine-macros = { path = "macros", version = "0.2.0", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "harel"
harness = false

[[bench]]
name = "compose"
harness = false

[[bench]]
name = "encodings"
harness = false

[[test]]
name = "macros_xor"
required-features = ["macros"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
