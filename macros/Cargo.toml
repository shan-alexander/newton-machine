[package]
name = "newton-machine-macros"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Proc-macro implementation for newton-machine (depend on newton-machine with feature `macros`)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shan-alexander/newton-machine"
homepage = "https://github.com/shan-alexander/newton-machine"
documentation = "https://docs.rs/newton-machine"
readme = "README.md"
keywords = ["state-machine", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
authors = ["Newton Machine Contributors"]
publish = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
